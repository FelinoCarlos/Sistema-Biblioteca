<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Static/Css/index.css">
     <link href='https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css' rel='stylesheet'>
    <title>Pagina Inicial</title>

</head>
<body>
  <header>
    <nav>
        <a href="/" class="nav_link" data-link>Pagina Inicial</a>
        <a href="/emprestimo.html" class="nav_link" data-link>Emprestimos</a>
        <a href="/catalogo.html" class="nav_link" data-link>Catalogo</a>
        <a href="/cliente.html" class="nav_link" data-link>Clientes</a>
  </nav>

            <h1>Pagina Inicial</h1>
            <p>Bem vindo ao sistema de biblioteca</p>

            <input type="date" id="data" >
            <p id="Semana"></p>
    </header>

            <div>
              <div>
              <p>Emprestimo ativo</p>
              <span id="emprestimo-ativo">0</span>
              </div>

              <div>
              <p>Livros em Atraso</p>
              <span id="Livros-em-Atraso">0</span>
              </div>

              <div>
              <p>Usuario Cadastrado</p>
              <span id="Usuario-Cadastrado">0</span>
              </div>

              <div>
              <p>Total de Livros</p>
              <span id="Total-de-Livros">0</span>
              </div>
            </div>


        
        <div>
            <button id="btn-button" data-dialog="dialog1">+Novo Emprestimo</button>
            <button id="btn-button" data-dialog="dialog2">Devolução</button>
            <button id="btn-button" data-dialog="dialog3">+Addcionar Livros</button>
            <button id="btn-button" data-dialog="dialog4">+Cadastrar Usuairio</button>
        </div>


<dialog id="dialog1">
    <form>
      <h2>Novo emprestimo</h2>

      <label for="usuario">Usuario</label>
      <select name="usuario" id="usuario">
        <option value="usuario1">Usuario 1</option>
        <option value="usuario2">Usuario 2</option>
        <option value="usuario3">Usuario 3</option>
      </select>

      <label for="livro">Livro</label>
      <select name="livro" id="livro">
        <option value="livro1">Livro 1</option>
        <option value="livro2">Livro 2</option>
        <option value="livro3">Livro 3</option>
      </select>

      <label for="data-emprestimo">Data de emprestimo</label>
      <input type="date" name="data-emprestimo" id="data-emprestimo">

      <label for="data-vencimento">Data de vencimento</label>
      <input type="date" name="data-vencimento" id="data-vencimento">

      <button class="close">Cancelar</button>
      <button type="submit">Confirmar</button>
    </form>
</dialog>


<dialog id="dialog2">
    <h2>Processar Devolução</h2>

    <input type="search">

    <button class="close">Fechar</button>
    <button type="submit">Confirmar</button>
</dialog>

<dialog id="dialog3">
  <form id="CadastroLivro">
    <h2>Addicionar Livros</h2>

    <div></div>
    <input type="file" name="imagem" accept="image/*" id="Imagem" required>

    <label>Titulo do Livro</label>
    <input type="text" placeholder="Titulo do livro" id="titulo">

    <label>Autor do Livro</label>
    <input type="text" placeholder="Autor do livro" id="autor">

    <label>Quantidade</label>
    <input type="number" placeholder="Quantidade" id="quantidade">

    <button type="submit">Confirmar</button>
    <button class="close">Fechar</button>
   </form>
</dialog>



<dialog id="dialog4">
    <form id="cadastroUsuario" >
        <h2>Cadastrar usuário</h2>

        <input type="text" id="nome" placeholder="Nome do usuário" >

        <input type="text" id="cpf" placeholder="CPF" maxlength="11" >

        <input type="email" id="email" placeholder="E-mail" required>

        <input type="tel" id="telefone" placeholder="Telefone"  pattern="^[1-9]{2}\-[2-9][0-9]{7,8}$">

        <button type="submit"  id="cadastrar">Cadastrar</button>

        <button type="button" class="close">Fechar</button>
    </form>
</dialog>

   

  <script type="module" src="/Static/js/index.js"></script>
<script type="module" src="/Static/js/cadastro.js"></script>
</body>
</html>
