<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Static/Css/index.css">

    <title>Pagina Inicial</title>
</head>
<body>
    <nav>
        <a href="/" class="nav_link" data-link>Pagina Inicial</a>
        <a href="/emprestimos" class="nav_link" data-link>Emprestimos</a>
        <a href="/catalogo" class="nav_link" data-link>Catalogo</a>

            <h1>Pagina Inicial</h1>
            <p>Bem vindo ao sistema de biblioteca</p>

            <input type="date" id="data" >
            <p id="Semana"></p>

            <div>
              <div>
              <p>Emprestimo ativo</p>
              <span id="emprestimo-ativo">0</span>
              </div>

              <div>
              <p>Livros em Atraso</p>
              <span id="Livros-em-Atraso">0</span>
              </div>

              <div>
              <p>Usuario Cadastrado</p>
              <span id="Usuario-Cadastrado">0</span>
              </div>

              <div>
              <p>Total de Livros</p>
              <span id="Total-de-Livros">0</span>
              </div>
            </div>


        <div>
            <button id="btn-emprestimo">+Novo Emprestimo</button>
            <button id="btn-catalogo">Devolução</button>
            <button id="btn-livros">+Addcionar Livros</button>
            <button id="btn-usuarios">+Cadastrar Usuairio</button>
        </div>

        <div class="modal" id="modal">
            <div class="modal-inner">
            <form>
                <h1>formulario</h1>
                <button id="closeModal">fechar</button>
            </form>
            </div>
        </div>


        <table>
        <thead>
            <tr>
                <th>Usuario</th>
                <th>Livro</th>
                <th>Data de vencimento</th>
                <th>Dias de atraso</th>
                <th>ações</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Sara</td>
                <td>Ordem paranormal</td>
                <td>12-10-2026</td>
                <td>10 dias</td>

                <td>
                <button>Devolver</button>
                </td>
            </tr>
        </tbody>
        </table>

 <script>
const openBtn = document.getElementById('btn-emprestimo');
const closeBtn = document.getElementById('closeModal');
const modal = document.getElementById('modal');

openBtn.addEventListener('click',() =>{
    modal.classList.add('open');
});
closeBtn.addEventListener("click",() =>{
    modal.classList.add('open');
});
</script>       
      
<style>
            h1{
    color: red;
}

.modal{
    background-color: red;
    opacity: 0;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    transition: all 0.3 ease-in-out;
    z-index: -1;
    display: flex;
    align-items: center;
    justify-content: center;

    .modal.open{
        opacity: 1;
        z-index: 999;
    }


}
</style>

</body>
</html>
