<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empréstimos | Biblioteca</title>
    <link rel="stylesheet" href="/Static/Css/base.css">
</head>
<body>

      <!-- Cabeçalho do site: só logo e menu -->
    <header>
        <div class="barra">
            <a href="/" class="logo">Biblioteca</a>
            <nav>
            <a href="/index.html" class="nav_link ativo" data-link>Página Inicial</a>
            <a href="/emprestimo.html" class="nav_link" data-link>Empréstimos</a>
            <a href="/catalogo.html" class="nav_link" data-link>Catálogo</a>
            <a href="/cliente.html" class="nav_link" data-link>Clientes</a>
            </nav>
        </div>
    </header>

    <main>
        
          <!-- Título e subtítulo -->
        <div class="titulo-pagina">
            <h2>Empréstimos e Devoluções</h2>
            <p>Gerencie os empréstimos e devoluções dos livros da livraria.</p>
        </div>

        <section class="filtros">
            <input type="search" id="buscaEmprestimo" placeholder="Buscar por livro ou cliente..." aria-label="Buscar empréstimo">
            <select id="filtroStatus" aria-label="Filtrar por status">
                <option value="todos">Todos</option>
                <option value="ativo">Em andamento</option>
                <option value="atrasado">Atrasados</option>
                <option value="devolvido">Devolvidos</option>
            </select>
            <button type="button" id="btnNovoEmprestimo">+ Novo empréstimo</button>
        </section>

        <dialog id="dialogEmprestimo">
            <form id="formEmprestimo">
                <h2>Novo empréstimo</h2>

                <label for="selectCliente">Cliente</label>
                <select id="selectCliente" required>
                    <option value="">Selecione o cliente</option>
                </select>

                <label for="selectLivro">Livro (somente disponíveis)</label>
                <select id="selectLivro" required>
                    <option value="">Selecione o livro</option>
                </select>

                <label for="prazoDias">Prazo (dias)</label>
                <input type="number" id="prazoDias" min="1" max="90" step="1" value="7" required>

                <p id="previaDevolucao"></p>
                <p id="avisoEmprestimo" role="alert"></p>

                <button type="submit" id="btnEmprestar">Emprestar</button>
                <button type="button" class="close">Cancelar</button>
            </form>
        </dialog>

        <p id="mensagemEmprestimos" aria-live="polite"></p>

        <table>
            <thead>
                <tr>
                    <th>Livro</th>
                    <th>Cliente</th>
                    <th>Emprestado em</th>
                    <th>Devolver até</th>
                    <th>Status</th>
                    <th class="columnAction">Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaEmprestimos"></tbody>
        </table>
    </main>

    <script type="module" src="/Static/js/emprestimo.js"></script>
</body>
</html>

    <footer class="rodape-inicial">
        <p>Sistema de Gerenciamento de Biblioteca</p>
    </footer>
