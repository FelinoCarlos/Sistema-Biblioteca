
 <div class="titulo-pagina">
        <h1>Usuários</h1>
        <p>Gerencie seus usuários.</p>
</div>

   <section class="filtros">
        <input type="search" placeholder="Buscar usuário..." aria-label="Buscar usuário">
        <button type="button" id="btn-button" data-dialog="dialog4">+ Cadastrar usuário</button>
    </section>

<dialog id="dialog4">
    <form id="cadastroUsuario" >
        <h2>Cadastrar usuário</h2>

        <input type="text" id="nome" name="nome" placeholder="Nome do usuário" required>

        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" required>

        <input type="email" id="email" name="email" placeholder="E-mail" required>

        <input type="tel" id="telefone" name="telefone" placeholder="(11) 98765-4321" maxlength="15" pattern="\(\d{2}\) \d{4,5}-\d{4}" required>

        <button type="submit"  id="cadastrar">Cadastrar</button>

        <button type="button" class="close">Fechar</button>
    </form>
</dialog>
<script>
     // Máscara do telefone: (11) 91234-5678
    const telefone = document.getElementById("telefone");
    telefone.addEventListener("input", () => {
      let v = telefone.value.replace(/\D/g, "").slice(0, 11);
      v = v.replace(/^(\d{2})(\d)/, "($1) $2");
      v = v.replace(/(\d{5})(\d{1,4})$/, "$1-$2");
      telefone.value = v;
    });
</script>

    <table>
    <thead>
        <tr>
            <th>Nome</th>
            <th>CPF</th>
            <th>E-mail</th>
            <th>Telefone</th>
            <th  class="columnAction" >Ações</th>
        </tr>
    </thead>

    <tbody id="tabelaUsuarios">
    </tbody>
</table>

    
        <script type="module" src="/js/cliente.js"></script>
